# Continuous integration (docs/guides/build-and-ci.md#github-actions).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Source checks that need no compiler or dependencies.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned: other clang-format versions can format slightly differently (see .clang-format).
      - name: Install clang-format
        run: python -m pip install clang-format==22.1.3

      # The matcher turns clang-format's "file:line:col: error:" lines into annotations.
      - name: Check formatting
        run: |
          echo "::add-matcher::.github/problem-matchers/clang-format.json"
          python tools/scripts/check_format.py

      # The remaining checks also run after a failed one, so a single run reports every problem.
      - name: Test check scripts
        if: success() || failure()
        run: python -m unittest discover -s tools/scripts/tests -v

      # The matcher turns "file:line:col: error: message [rule]" lines into annotations.
      - name: Check layer includes
        if: success() || failure()
        run: |
          echo "::add-matcher::.github/problem-matchers/teserra-checks.json"
          python tools/scripts/check_layers.py

      - name: Check backend and platform leaks
        if: success() || failure()
        run: |
          echo "::add-matcher::.github/problem-matchers/teserra-checks.json"
          python tools/scripts/check_gl_leaks.py

      # The machine setup script (tools/setup/setup.sh); shellcheck is part of the runner image.
      - name: Lint shell scripts
        if: success() || failure()
        run: shellcheck --format=gcc tools/setup/setup.sh

  # Debug with warnings as errors (ci-windows), Release with warnings as errors (ci-windows-release) for
  # warnings only Release shows, such as parameters used only in assertion messages (#204), and the Tracy
  # profile build (ci-windows-profile, #107). In parallel, so a PR waits no longer than for one of them.
  windows-msvc:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            preset: ci-windows
          - name: windows-msvc-release
            preset: ci-windows-release
          - name: windows-msvc-profile
            preset: ci-windows-profile
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # test result annotations
    env:
      VCPKG_TRIPLET: x64-windows
      # Mesa for the GPU step (#110): pinned, and checked against the release asset's SHA-256.
      MESA_VERSION: 26.3.0
      MESA_SHA256: c505fcc77e8f63a09d7ddac086591d2f542c0698d37fc9e3094685a34d0d9991
    steps:
      - uses: actions/checkout@v7

      # Runs vcvars64.bat of the newest Visual Studio on the runner and exports every environment
      # variable it adds or changes, so later steps see MSVC, the Windows SDK and Ninja.
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }
          Write-Host "MSVC environment from $vcvars"

      - name: Configure vcpkg
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "RUNNER_IMAGE=${env:ImageOS}-${env:ImageVersion}" >> $env:GITHUB_ENV

      # Binary cache: compiled vcpkg packages, keyed by runner image (compiler version) and manifest.
      # Restore keys reuse an older cache, so a manifest change only rebuilds the packages that changed.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-

      # The setup script must recognize a machine that has everything (#210). The LLVM tools are not on the
      # runner (the checks job pins its own clang-format), so they are skipped.
      - name: Setup script check
        if: matrix.preset == 'ci-windows'
        shell: bash
        run: bash tools/setup/setup.sh --check --skip-llvm

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The matcher turns Catch2's "file(line): FAILED:" lines into annotations on the source line.
      - name: Test
        run: |
          echo "::add-matcher::.github/problem-matchers/catch2.json"
          ctest --preset ${{ matrix.preset }}

      # GPU tests and example smoke runs on Mesa's llvmpipe, a software OpenGL 4.6 driver (#110, spike #52):
      # Windows loads an opengl32.dll next to the executable before the system's. TESERRA_REQUIRE_GPU_TESTS
      # makes a GPU test that cannot get a context fail instead of skip, and the step fails if any test did
      # not run, so a broken Mesa deployment or a broken example cannot pass as a skip. Debug job only: one
      # build is enough, and llvmpipe adds about a minute. TESERRA_GPU_BACKEND names the backend of the
      # backend-independent GPU tests; a Vulkan backend (lavapipe, same Mesa package) runs this step again.
      - name: Restore Mesa
        if: matrix.preset == 'ci-windows'
        id: mesa-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mesa
          key: mesa-${{ env.MESA_VERSION }}-msvc-x64

      - name: Download Mesa
        if: matrix.preset == 'ci-windows' && steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa archive SHA-256 is $hash, expected $env:MESA_SHA256" }
          7z x $archive "-o$env:RUNNER_TEMP\mesa" "x64\opengl32.dll" "x64\libgallium_wgl.dll" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }

      - name: GPU tests on llvmpipe
        if: matrix.preset == 'ci-windows'
        shell: pwsh
        env:
          TESERRA_REQUIRE_GPU_TESTS: "1"
          TESERRA_GPU_BACKEND: opengl
          GALLIUM_DRIVER: llvmpipe
        run: |
          $mesa = Join-Path $env:RUNNER_TEMP "mesa\x64"
          foreach ($dll in "opengl32.dll", "libgallium_wgl.dll") {
            if (-not (Test-Path (Join-Path $mesa $dll))) { throw "Mesa's $dll is missing from $mesa" }
          }
          $dirs = Get-ChildItem build/${{ matrix.preset }} -Recurse -Filter "teserra_*.exe" |
            ForEach-Object DirectoryName | Sort-Object -Unique
          foreach ($dir in $dirs) { Copy-Item (Join-Path $mesa "*.dll") $dir }
          Write-Host "Mesa $env:MESA_VERSION next to the executables in $($dirs.Count) directories"
          echo "::add-matcher::.github/problem-matchers/catch2.json"
          ctest --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath ctest-gpu.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notRun = Select-String -Path ctest-gpu.log -Pattern "\((Skipped|Not Run)\)"
          if ($notRun) {
            $notRun | ForEach-Object { Write-Host "::error::Did not run on llvmpipe: $($_.Line.Trim())" }
            exit 1
          }

      # The game template (#120) built the way a game builds it: Teserra through FetchContent, pointed at this
      # checkout instead of the release tag, and the template's own vcpkg manifest, whose packages the binary
      # cache already has. Then 120 frames on llvmpipe, which must exit with 0 and log nothing at Error or above.
      - name: Game template
        if: matrix.preset == 'ci-windows'
        shell: pwsh
        working-directory: templates/minimal_game
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $build = Join-Path $env:RUNNER_TEMP "template"
          cmake --preset debug -B $build "-DFETCHCONTENT_SOURCE_DIR_TESERRA=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $env:RUNNER_TEMP "mesa\x64\*.dll") $build
          $log = & (Join-Path $build "minimal_game.exe") --frames 120 --hidden-window 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $log
          if ($code -ne 0) { Write-Host "::error::minimal_game exited with $code"; exit 1 }
          if ($log -match "\[(error|critical)\]") { Write-Host "::error::minimal_game logged an error"; exit 1 }

      # A failed snapshot test writes the actual image and a diff (#111); the PR's artifacts show both.
      - name: Upload snapshot images
        if: failure() && hashFiles('tests/golden/_actual/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-snapshots
          path: |
            tests/golden/_actual/
            tests/golden/_diff/

      - name: Annotate test results
        if: always() && hashFiles('build/${{ matrix.preset }}/junit.xml') != ''
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: build/${{ matrix.preset }}/junit.xml
          check_name: ${{ matrix.name }} tests
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          include_passed: false
          detailed_summary: true

      - name: Upload test results
        if: always() && hashFiles('build/${{ matrix.preset }}/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-junit
          path: build/${{ matrix.preset }}/junit.xml

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-vcpkg-logs
          path: |
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore

  # Linux (#127): Ubuntu 24.04 and 26.04 LTS with GCC and Clang are supported, so these jobs build everything
  # with warnings as errors and run the whole suite on Mesa's llvmpipe under Xvfb, like the Windows job:
  # TESERRA_REQUIRE_GPU_TESTS makes a GPU test without a context fail, and the step fails if any test did not
  # run. GCC and Clang on 26.04 cover the compilers; 24.04 is built with its own Clang 18 and the older LTS's
  # standard library. GCC needs 14.3 or newer: GCC 13 and 14.2, the GCCs 24.04 packages, cannot brace-
  # initialize a struct with a C-array member that has a default member initializer, such as
  # GraphicsPipelineDesc::colorBlend (build-and-ci.md, Linux).
  linux:
    name: linux (${{ matrix.compiler }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, compiler: gcc, cxx: g++ }
          - { os: ubuntu-26.04, compiler: clang, cxx: clang++, tidy: true }
          - { os: ubuntu-24.04, compiler: clang, cxx: clang++ }
    env:
      VCPKG_TRIPLET: x64-linux
      PRESET: ci-linux-${{ matrix.compiler }}
    steps:
      # Depth 2: a PR's merge commit and its parents, so clang-tidy can compare with the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # vcpkg's glfw3 builds on the system's X11 libraries and its own Wayland (platform-abstraction.md, GLFW
      # on Linux); Xvfb, Mesa and Weston run the GPU tests and the Wayland window tests.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            xvfb xauth libgl1-mesa-dri libegl-mesa0 weston

      - name: Configure vcpkg
        run: |
          cache="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$cache"
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKG_BINARY_CACHE=$cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite"
            echo "RUNNER_IMAGE=$ImageOS-$ImageVersion"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg"
          } >> "$GITHUB_ENV"
          mkdir -m 700 -p "$RUNNER_TEMP/xdg"
          echo "Compiler: $(${{ matrix.cxx }} --version | head -1)"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ matrix.cxx }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ matrix.cxx }}-${{ env.RUNNER_IMAGE }}-

      - name: Configure
        run: cmake --preset "$PRESET" -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # -k 0: keep going after a failure, so one run shows every error GCC or Clang finds.
      - name: Build
        id: build
        run: cmake --build --preset "$PRESET" -- -k 0

      - name: Test on llvmpipe (X11)
        env:
          TESERRA_REQUIRE_GPU_TESTS: "1"
          TESERRA_GPU_BACKEND: opengl
          GALLIUM_DRIVER: llvmpipe
        run: |
          echo "::add-matcher::.github/problem-matchers/catch2.json"
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset "$PRESET" 2>&1 | tee ctest-gpu.log
          if grep -E "\((Skipped|Not Run)\)" ctest-gpu.log; then
            echo "::error::Some tests did not run on llvmpipe"
            exit 1
          fi

      # The window tests again on Wayland: Weston's X11 backend inside Xvfb, because GLFW 3.4 crashes on a
      # compositor without a seat, as a headless Weston is (platform-abstraction.md, GLFW on Linux).
      - name: Window tests on Wayland
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            weston --backend=x11 --socket=teserra-wayland --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
            weston=$!
            for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/teserra-wayland" ] && break; sleep 0.2; done
            WAYLAND_DISPLAY=teserra-wayland "build/$PRESET/engine/platform/tests/teserra_platform_tests" "[window]"
            status=$?
            kill "$weston"
            exit $status'

      # The game template (#120), built the way a game builds it, as in the Windows job.
      - name: Game template
        working-directory: templates/minimal_game
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          build="$RUNNER_TEMP/template"
          cmake --preset debug -B "$build" "-DFETCHCONTENT_SOURCE_DIR_TESERRA=$GITHUB_WORKSPACE" "-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"
          cmake --build "$build"
          set +e
          log="$(xvfb-run -a "$build/minimal_game" --frames 120 --hidden-window 2>&1)"
          code=$?
          echo "$log"
          if [ "$code" -ne 0 ]; then echo "::error::minimal_game exited with $code"; exit 1; fi
          if echo "$log" | grep -E "\[(error|critical)\]"; then echo "::error::minimal_game logged an error"; exit 1; fi

      # clang-tidy on the lines a PR changes (#142), with this build's compile database and generated headers;
      # also after failed tests, so one run reports both. The wheel is the 22.1 release nearest to the pinned
      # clang-format and brings its own Clang headers. HEAD^1 is the base branch side of the merge commit.
      - name: clang-tidy on changed lines
        if: (success() || failure()) && steps.build.outcome == 'success' && matrix.tidy && github.event_name == 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/tidy"
          "$RUNNER_TEMP/tidy/bin/pip" install --quiet clang-tidy==22.1.8
          echo "::add-matcher::.github/problem-matchers/clang-tidy.json"
          python3 tools/scripts/check_tidy.py -p "build/$PRESET" --base HEAD^1 --clang-tidy "$RUNNER_TEMP/tidy/bin/clang-tidy"

      - name: Upload snapshot images
        if: failure() && hashFiles('tests/golden/_actual/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.os }}-snapshots
          path: |
            tests/golden/_actual/
            tests/golden/_diff/

      - name: Annotate test results
        if: always() && hashFiles(format('build/{0}/junit.xml', env.PRESET)) != ''
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: build/${{ env.PRESET }}/junit.xml
          check_name: linux (${{ matrix.compiler }}, ${{ matrix.os }}) tests
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          include_passed: false
          detailed_summary: true

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.os }}-vcpkg-logs
          path: |
            build/${{ env.PRESET }}/vcpkg-manifest-install.log
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore

  # A build without a window system (TESERRA_PORTABLE_ONLY): core, ecs, scene, rhi with the null backend and
  # the platform without its window backend, for tools and servers that need no window. It keeps that
  # configuration building now that the jobs above build everything. GCC only, and fast: no GLFW, glslang or
  # SPIRV-Cross.
  linux-portable:
    name: linux-portable
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      VCPKG_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure vcpkg
        run: |
          cache="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$cache"
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKG_BINARY_CACHE=$cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite"
            echo "RUNNER_IMAGE=$ImageOS-$ImageVersion"
          } >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-portable-gcc-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-portable-gcc-

      - name: Configure
        run: cmake --preset linux-gcc-portable

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset linux-gcc-portable -- -k 0

      - name: Test
        run: ctest --preset linux-gcc-portable
