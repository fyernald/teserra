# Label definitions for fyernald/tessera.
# Applied with `gh label create <name> --color <color> --description <description> --force`
# (see docs/process/development-process.md). Priority, iteration, estimate and target version
# are GitHub Project fields, not labels.

# Type (mirrors the Project "Work type" field; issue templates apply these)
- name: "type:feature"
  color: "1d76db"
  description: "User-visible capability or headline feature"
- name: "type:task"
  color: "0e8a16"
  description: "Planned engineering work (1-6 h)"
- name: "type:bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type:refactor"
  color: "fbca04"
  description: "Tech debt and cleanup without behavior change"
- name: "type:spike"
  color: "5319e7"
  description: "Time-boxed research; code is thrown away"
- name: "type:rfc"
  color: "c5def5"
  description: "Design proposal that needs discussion before an ADR"
- name: "epic"
  color: "3e4b9e"
  description: "Tracking issue with sub-issues (headline feature or future track)"

# Area (mirrors the Project "Area" field)
- name: "area:core"
  color: "bfd4f2"
  description: "teserra_core: types, assert, log, handles, math, memory"
- name: "area:platform"
  color: "bfd4f2"
  description: "teserra_platform: window, input, filesystem, timing"
- name: "area:rhi"
  color: "bfd4f2"
  description: "teserra_rhi and backends"
- name: "area:renderer"
  color: "bfd4f2"
  description: "teserra_renderer: passes, cameras, sprites, materials"
- name: "area:ecs"
  color: "bfd4f2"
  description: "teserra_ecs and teserra_scene"
- name: "area:assets"
  color: "bfd4f2"
  description: "teserra_assets: IDs, handles, loaders"
- name: "area:build"
  color: "bfd4f2"
  description: "CMake, vcpkg, CI, tooling"
- name: "area:docs"
  color: "bfd4f2"
  description: "Documentation, ADRs, process"
- name: "area:editor"
  color: "bfd4f2"
  description: "Debug UI and editor (future)"

# Process
- name: "needs-triage"
  color: "e99695"
  description: "New; needs type, area, priority and estimate"
- name: "needs-design"
  color: "d4c5f9"
  description: "Design note or ADR required before coding"
- name: "blocked"
  color: "b60205"
  description: "Waiting on another issue or decision"
- name: "feedback"
  color: "f9d0c4"
  description: "Feedback request or item originating from tester feedback"
- name: "retro"
  color: "ededed"
  description: "Iteration review and retrospective"
- name: "breaking-change"
  color: "b60205"
  description: "Changes public API or behavior; needs CHANGELOG migration note"
- name: "good first issue"
  color: "7057ff"
  description: "Scoped for newcomers (see CONTRIBUTING good first issue policy)"
- name: "help wanted"
  color: "008672"
  description: "Maintainer would especially welcome help"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
